name: semantic_pipeline_secure

services:
  cert_setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    user: "0"
    network_mode: "none"
    environment:
      CERT_DAYS: "${ELASTICSEARCH_CERT_DAYS:-365}"
    secrets:
      - elastic_password
    volumes:
      # The CA private key is never mounted into the Elasticsearch service.
      - secure_elasticsearch_ca:/usr/share/elasticsearch/config/cert-authority
      - secure_elasticsearch_certs:/usr/share/elasticsearch/config/certs
    command:
      - bash
      - -c
      - |
        set -euo pipefail

        password="$$(cat /run/secrets/elastic_password)"
        if [ "$${#password}" -lt 16 ] || [ "$${password}" = "replace-me" ]; then
          echo "The Elasticsearch password secret must contain at least 16 characters." >&2
          exit 1
        fi
        unset password

        ca_dir=/usr/share/elasticsearch/config/cert-authority
        certs_dir=/usr/share/elasticsearch/config/certs
        mkdir -p "$${ca_dir}" "$${certs_dir}/ca"

        if [ ! -f "$${ca_dir}/ca/ca.crt" ] || [ ! -f "$${ca_dir}/ca/ca.key" ]; then
          rm -rf "$${ca_dir}/ca" "$${ca_dir}/ca.zip"
          bin/elasticsearch-certutil ca \
            --silent \
            --pem \
            --out "$${ca_dir}/ca.zip"
          unzip -q "$${ca_dir}/ca.zip" -d "$${ca_dir}"
          rm -f "$${ca_dir}/ca.zip"
        fi

        if [ ! -f "$${certs_dir}/elasticsearch/elasticsearch.crt" ] || \
           [ ! -f "$${certs_dir}/elasticsearch/elasticsearch.key" ]; then
          rm -rf "$${certs_dir}/elasticsearch" "$${certs_dir}/certificates.zip"
          printf '%s\n' \
            'instances:' \
            '  - name: elasticsearch' \
            '    dns:' \
            '      - elasticsearch' \
            '      - localhost' \
            '    ip:' \
            '      - 127.0.0.1' > /tmp/instances.yml
          bin/elasticsearch-certutil cert \
            --silent \
            --pem \
            --days "$${CERT_DAYS}" \
            --in /tmp/instances.yml \
            --ca-cert "$${ca_dir}/ca/ca.crt" \
            --ca-key "$${ca_dir}/ca/ca.key" \
            --out "$${certs_dir}/certificates.zip"
          unzip -q "$${certs_dir}/certificates.zip" -d "$${certs_dir}"
          rm -f "$${certs_dir}/certificates.zip" /tmp/instances.yml
        fi

        cp "$${ca_dir}/ca/ca.crt" "$${certs_dir}/ca/ca.crt"
        chown -R root:root "$${ca_dir}" "$${certs_dir}"
        find "$${ca_dir}" "$${certs_dir}" -type d -exec chmod 750 {} \;
        find "$${ca_dir}" "$${certs_dir}" -type f -exec chmod 640 {} \;
        test -r "$${certs_dir}/ca/ca.crt"
        test -r "$${certs_dir}/elasticsearch/elasticsearch.crt"
        test -r "$${certs_dir}/elasticsearch/elasticsearch.key"
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    depends_on:
      cert_setup:
        condition: service_completed_successfully
    environment:
      node.name: elasticsearch-secure
      cluster.name: semantic-pipeline-secure
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic_password
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.http.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.http.ssl.supported_protocols: TLSv1.3,TLSv1.2
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.client_authentication: required
      xpack.security.transport.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.transport.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.supported_protocols: TLSv1.3,TLSv1.2
    secrets:
      - elastic_password
    ports:
      # Separate from the no-auth local node on 127.0.0.1:9200.
      - "127.0.0.1:${ELASTICSEARCH_SECURE_PORT:-19200}:9200"
    volumes:
      - secure_elasticsearch_certs:/usr/share/elasticsearch/config/certs:ro
      - secure_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --silent --show-error --fail
          --cacert config/certs/ca/ca.crt
          --user "elastic:$$(cat /run/secrets/elastic_password)"
          "https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"
          > /dev/null
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 45s
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    mem_limit: 2g

secrets:
  elastic_password:
    # Keep this file outside the repository; see ELASTICSEARCH_SECURE.md.
    file: "${ELASTIC_PASSWORD_SECRET_FILE:?Set ELASTIC_PASSWORD_SECRET_FILE to an absolute password-file path}"

volumes:
  secure_elasticsearch_ca:
  secure_elasticsearch_certs:
  secure_elasticsearch_data:
