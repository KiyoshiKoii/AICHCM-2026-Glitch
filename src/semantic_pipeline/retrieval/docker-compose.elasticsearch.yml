services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      - discovery.type=single-node
      # Local development only; port exposure is restricted to loopback.
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Long multi-event temporal queries expand into many multi_match terms
      # across several fields; the default 1024 clause cap rejects those with
      # a 400 (too_many_nested_clauses). Static setting, requires a restart.
      - indices.query.bool.max_clause_count=4096
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - semantic_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    mem_limit: 2g

volumes:
  semantic_elasticsearch_data:
